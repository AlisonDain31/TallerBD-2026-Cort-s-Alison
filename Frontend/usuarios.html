<body>

    <div class="container">
        <div class="card">
            <h2>Registrar Usuario del Sistema</h2>
            <form action="#" method="POST">
                <div class="grid-form">
                    <div class="form-group"><label>Nombre de Usuario *</label><input type="text" name="nombre_usuario" required></div>
                    <div class="form-group"><label>Contraseña *</label><input type="password" name="contraseña_usuario" required></div>
                    <div class="form-group"><label>Nombre Completo *</label><input type="text" name="nombre_completo" required></div>
                    <div class="form-group"><label>Rol *</label><select name="rol"><option value="Administrador">Administrador</option><option value="Consulta">Consulta</option></select></div>
                </div>
                <button type="submit">Guardar Usuario</button>
            </form>
        </div>
        <div class="card">
            <h2>Usuarios del Sistema</h2>
            <table>
                <thead><tr><th>ID</th><th>Usuario</th><th>Nombre Completo</th><th>Rol</th><th>Activo</th><th>Acciones</th></tr></thead>
                <tbody>
                    <tr><td>1</td><td>admin_inv</td><td>Juan Pérez</td><td>Administrador</td><td>Sí</td><td><button class="btn-edit">Editar</button> <button class="btn-del">Eliminar</button></td></tr>
                </tbody>
            </table>
        </div>
    </div>
